    captcha-protect:
      plugin:
        captcha-protect:
          rateLimit: 0
          ipv4subnetMask: 8
          window: 864000 # 10d
          mode: regex
          protectRoutes: ^/
          excludeRoutes:
            - \/oai\/request
            - \/node\/\d+\/manifest
          protectParameters: "true"
          challengeTmpl: /challenge.tmpl.html
          challengeURL: ""
          challengeStatusCode: 429
          captchaProvider: turnstile
          siteKey: {{ env "TURNSTILE_SITE_KEY" }}
          secretKey: {{ env "TURNSTILE_SECRET_KEY" }}
          ipForwardedHeader: X-Forwarded-For
          goodBots:
            - apple.com
            - archive.org
            - commoncrawl.org
            - duckduckgo.com
            - iframely.com
            - facebook.com
            - instagram.com
            - kagibot.org
            - linkedin.com
            - msn.com
            - openalex.org
            - twitter.com
            - x.com
          persistentStateFile: /acme/state.json
          protectFileExtensions: php,html,jp2,tif,tiff
          enableStateReconciliation: "false"
          periodSeconds: 30
          failureThreshold: 3
          enableGooglebotIPCheck: "true"
