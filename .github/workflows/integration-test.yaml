name: integration-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-fcrepo:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fcrepo_state: [on, off]
        blazegraph_state: [on]
    defaults:
      run:
        working-directory: sitectl-isle
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          path: sitectl-isle

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: libops/sitectl
          path: sitectl

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version: ">=1.25.3"

      - name: Use local sitectl workspace
        run: ./scripts/use-go-work.sh ../sitectl

      - name: Run create integration test
        run: ./scripts/test-create.sh "${{ matrix.fcrepo_state }}" public "${{ matrix.blazegraph_state }}"
