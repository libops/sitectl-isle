name: integration-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  create-fcrepo:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fcrepo_state: [on, off]
        blazegraph_state: [on]
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          path: sitectl-isle

      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: libops/sitectl
          ref: main
          path: sitectl

      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          repository: libops/sitectl-drupal
          ref: main
          path: sitectl-drupal

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: ">=1.25.3"

      - name: setup git identity
        working-directory: sitectl-isle
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Run create integration test
        working-directory: sitectl-isle
        run: make integration-test FCREPO_STATE=${{ matrix.fcrepo_state }} BLAZEGRAPH_STATE=${{ matrix.blazegraph_state }}
        env:
          TERM: xterm-256color
          SITECTL_REPO: ../sitectl
          SITECTL_DRUPAL_REPO: ../sitectl-drupal
