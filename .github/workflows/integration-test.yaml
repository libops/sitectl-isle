name: integration-test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  create-isle:
    name: sitectl create isle fcrepo=${{ matrix.fcrepo_state }} blazegraph=${{ matrix.blazegraph_state }} bot-mitigation=${{ matrix.bot_mitigation_state }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - fcrepo_state: on
            blazegraph_state: on
            isle_file_system_uri: public
            iiif_implementation: triplet
            iiif_topology: disabled
            bot_mitigation_state: off
          - fcrepo_state: off
            blazegraph_state: on
            isle_file_system_uri: public
            iiif_implementation: triplet
            iiif_topology: disabled
            bot_mitigation_state: off
          - fcrepo_state: off
            blazegraph_state: off
            isle_file_system_uri: private
            iiif_implementation: triplet
            iiif_topology: disabled
            bot_mitigation_state: on
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          path: sitectl-isle

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: ">=1.26.1"

      - name: Install sitectl and sitectl-drupal
        run: |
          curl -fsSL https://packages.libops.io/sitectl/sitectl-archive-keyring.asc | sudo gpg --dearmor -o /usr/share/keyrings/sitectl-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/sitectl-archive-keyring.gpg] https://packages.libops.io/sitectl ./" | sudo tee /etc/apt/sources.list.d/sitectl.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y sitectl sitectl-drupal

      - name: setup git identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Run create integration test
        working-directory: sitectl-isle
        run: make integration-test FCREPO_STATE=${{ matrix.fcrepo_state }} BLAZEGRAPH_STATE=${{ matrix.blazegraph_state }} ISLE_FILE_SYSTEM_URI=${{ matrix.isle_file_system_uri }} IIIF_IMPLEMENTATION=${{ matrix.iiif_implementation }} IIIF_TOPOLOGY=${{ matrix.iiif_topology }} BOT_MITIGATION_STATE=${{ matrix.bot_mitigation_state }}
        env:
          TERM: xterm-256color
