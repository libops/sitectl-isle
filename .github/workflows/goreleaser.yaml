name: goreleaser

on:
  workflow_dispatch:
    inputs:
      release-mode:
        description: Recovery mode; full is only valid from a new tag ref
        required: true
        type: choice
        default: packages-only
        options:
          - packages-only
          - homebrew-only
          - full
      release-version:
        description: Existing vMAJOR.MINOR.PATCH tag for a recovery mode
        required: false
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    uses: libops/.github/.github/workflows/sitectl-plugin-goreleaser.yaml@77724fe807ede3e0808d4556f47e4ad0ae266bac # main
    permissions:
      contents: write
      id-token: write
    secrets: inherit
    with:
      go-version: "1.26.5"
      # The release bumper dispatches this workflow at the new tag without
      # inputs. Force every tag ref through the full release path instead of
      # inheriting the manual recovery default.
      release-mode: ${{ github.ref_type == 'tag' && 'full' || inputs.release-mode }}
      release-version: ${{ inputs.release-version }}
      package-name: sitectl-isle
