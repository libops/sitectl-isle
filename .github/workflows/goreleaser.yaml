    uses: libops/.github/.github/workflows/sitectl-plugin-goreleaser.yaml@45a727f250c38776630d6c37a01328b140a78d99 # main
    permissions:
      contents: write
      id-token: write
    secrets: inherit
    with:
      go-version: ">=1.26.1"
      package-name: sitectl-isle
