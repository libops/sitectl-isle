name: goreleaser

on:
  workflow_dispatch:
    inputs:
      release-mode:
        description: Recovery mode; full is only valid from a new tag ref
        required: true
        type: choice
        default: packages-only
        options:
          - packages-only
          - homebrew-only
          - full
      release-version:
        description: Existing vMAJOR.MINOR.PATCH tag for a recovery mode
        required: false
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    uses: libops/.github/.github/workflows/sitectl-plugin-goreleaser.yaml@ad2e8856581c741cfd811f4704e3674e4c2d6868 # main
    permissions:
      contents: write
      id-token: write
    secrets: inherit
    with:
      go-version: "1.26.5"
      release-mode: ${{ inputs.release-mode || 'full' }}
      release-version: ${{ inputs.release-version }}
      package-name: sitectl-isle
